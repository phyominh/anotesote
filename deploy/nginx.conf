# nginx site for study-kb, written by `scripts/install.sh --nginx`.
# @DOMAIN@ and @PORT@ are filled in by the script. certbot --nginx then adds
# the :443 server and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    client_max_body_size 4m;

    # OAuth MCP endpoint. Needs its own exact match: without it nginx answers
    # POST /mcp with a 301 to /mcp/ (because of the prefix block below).
    location = /mcp {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Legacy /mcp/<secret> URL: keep it out of nginx's access log, and out of
    # the error log too (error lines include the request line).
    location /mcp/ {
        access_log off;
        error_log /dev/null;

        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin UI and API. Realtime uses server-sent events, so no buffering.
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
